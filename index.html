<title>날씨 정원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: full-bleed 3D diorama with a chunky game HUD — title badge on top, weather dock at the bottom. Single deliberate look (sky game world). */
:root{
  --ink:#33294a;
  --card:#ffffff;
  --card-2:#f2efff;
  --muted:#6d6585;
  --accent:#ff7a6b;
  --sun:#ffe27a;
  --cloud:#e3e8f0;
  --rain:#a9d4ff;
  --snow:#dff3ff;
  --sky:#9fd8ff;
  --display:"Nanum Gothic",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Nanum Gothic",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#c.dragging{cursor:grabbing}

.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.badge{pointer-events:auto;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:7px 14px 8px;box-shadow:0 4px 0 var(--ink);min-width:0}
.badge h1{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;margin:0;letter-spacing:.5px}
.badge p{margin:2px 0 0;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{pointer-events:none;align-self:center;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:.82rem;transition:opacity .6s}
.hint.gone{opacity:0}

.dock{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;flex-direction:column;align-items:center}
.dock-inner{pointer-events:auto;width:100%;max-width:560px;background:var(--card);border:2px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:12px;display:grid;gap:10px}
.wbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wbtn{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--ink);background:var(--card-2);border:2px solid var(--ink);border-radius:14px;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s}
.wbtn svg{width:32px;height:32px}
.wbtn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.wbtn[aria-pressed="true"]{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.wbtn[data-w="sunny"][aria-pressed="true"]{background:var(--sun)}
.wbtn[data-w="cloudy"][aria-pressed="true"]{background:var(--cloud)}
.wbtn[data-w="rain"][aria-pressed="true"]{background:var(--rain)}
.wbtn[data-w="snow"][aria-pressed="true"]{background:var(--snow)}
.sbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sbtn{font-family:var(--display);font-weight:800;font-size:.9rem;color:var(--ink);background:var(--card-2);border:2px solid var(--ink);border-radius:10px;padding:5px 2px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.sbtn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot);border:1.5px solid var(--ink)}
.sbtn[data-s="spring"]{--dot:#ff9cbc;--on:#ffd6e4}
.sbtn[data-s="summer"]{--dot:#5cbf5f;--on:#cdeeb8}
.sbtn[data-s="autumn"]{--dot:#f0662f;--on:#ffd0ac}
.sbtn[data-s="winter"]{--dot:#ffffff;--on:#dcebf8}
.sbtn[aria-pressed="true"]{background:var(--on);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sbtn:focus-visible,.wbtn:focus-visible,.go:focus-visible,.city:focus-visible,.slider:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.more{display:grid;gap:10px;min-width:0}
.moreBtn{display:none;font-family:var(--body);font-weight:800;font-size:.85rem;color:var(--ink);background:none;border:0;padding:2px;cursor:pointer;justify-self:center}
.moreBtn::after{content:" ▾"}
.moreBtn[aria-expanded="true"]::after{content:" ▴"}
.moreBtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row label{width:4.6em;font-family:var(--display);font-weight:800;font-size:.98rem;white-space:nowrap}
.slider{flex:1;min-width:0;accent-color:var(--accent);height:24px}
.amt{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);width:3.2em;text-align:right}
form.row{gap:8px}
.city{flex:1;min-width:0;font-family:var(--body);font-size:.95rem;color:var(--ink);background:var(--card-2);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.city::placeholder{color:var(--muted)}
.go{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--card);background:var(--accent);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.go:disabled{opacity:.6;cursor:wait}
.catrow{display:grid;gap:6px;min-width:0}
.cathead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cathead span{font-family:var(--display);font-weight:800;font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font-family:var(--body);font-weight:700;font-size:.82rem;color:var(--ink);background:var(--card-2);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#ffe0a3}
.chip:focus-visible,.focus:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.focus{font-family:var(--body);font-weight:700;font-size:.8rem;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:3px 9px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.focus[aria-pressed="true"]{background:#ffe0a3;transform:translateY(2px);box-shadow:none}
@media (max-width:819px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}}
.status{font-size:.8rem;color:var(--muted);margin:0;line-height:1.4}
.status:empty{display:none}
.credit{margin:0;font-size:.72rem;color:var(--muted)}
.credit a{color:inherit}

.bubble{position:absolute;left:0;top:0;pointer-events:none;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:1rem;white-space:nowrap;box-shadow:0 3px 0 var(--ink);transform-origin:50% 100%;opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
.zzz{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--display);font-weight:800;color:var(--ink);opacity:0;transition:opacity .4s;display:flex;gap:2px;align-items:flex-end}
.zzz.show{opacity:1}
.zzz span{display:inline-block;animation:zfloat 2.4s ease-in-out infinite;text-shadow:0 0 6px #fff,0 0 2px #fff}
.zzz span:nth-child(1){font-size:.8rem;animation-delay:0s}
.zzz span:nth-child(2){font-size:1.1rem;animation-delay:.4s}
.zzz span:nth-child(3){font-size:.8rem;animation-delay:.8s}
@keyframes zfloat{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
@media (prefers-reduced-motion:reduce){.zzz span{animation:none}}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

@media (min-width:820px){
  .dock{top:calc(env(safe-area-inset-top,0px) + 14px);bottom:auto;left:auto;justify-content:flex-end}
  .dock-inner{width:300px}
  .hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .wbtns{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:819px){
  .moreBtn{display:block}
  .more:not(.open){display:none}
  .dock{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .dock-inner{padding:8px 10px 4px;gap:7px;border-radius:20px;box-shadow:0 4px 0 var(--ink);max-height:62vh;overflow-y:auto}
  .wbtns{gap:6px}
  .wbtn{flex-direction:row;justify-content:center;gap:4px;font-size:.88rem;padding:5px 2px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
  .wbtn svg{width:20px;height:20px}
  .wbtn[aria-pressed="true"]{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .sbtn{font-size:.82rem;padding:3px 2px;box-shadow:0 2px 0 var(--ink)}
  .sbtn[aria-pressed="true"]{box-shadow:0 0 0 var(--ink)}
}
@media (max-width:480px){
  .hud-top{top:calc(env(safe-area-inset-top,0px) + 10px)}
  .badge{padding:5px 11px 6px;border-radius:13px;box-shadow:0 3px 0 var(--ink)}
  .badge h1{font-size:1.05rem}
  .badge p{font-size:.72rem}
  .hint{display:none}
}

/* ---- refined skin: frosted glass panels, soft shadows, segmented controls ---- */
:root{--line:rgba(51,41,74,.12);--fill:rgba(51,41,74,.055);--fill-2:rgba(51,41,74,.09);--glass:rgba(255,255,255,.74);--lift:0 10px 30px rgba(40,30,80,.14),0 1px 3px rgba(40,30,80,.08);--pick:0 1px 2px rgba(40,30,80,.12),0 4px 12px rgba(40,30,80,.10)}
.badge,.dock-inner,.hint,.bubble{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.85);box-shadow:var(--lift)}
.badge{border-radius:14px}
.badge h1{letter-spacing:-.2px}
.hint{color:var(--muted)}
.dock-inner{border-radius:22px;padding:12px}
.bubble{font-weight:700;border-radius:12px}
.bubble::after{background:rgba(255,255,255,.92);border:0}
.wbtns{background:var(--fill);padding:4px;border-radius:16px;gap:4px}
.wbtn,.wbtn:hover{background:transparent;border:0;box-shadow:none;transform:none;border-radius:12px;font-weight:700;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.wbtn:hover{background:rgba(255,255,255,.5)}
.wbtn svg{opacity:.75;transition:opacity .2s}
.wbtn[aria-pressed="true"],.wbtn[data-w][aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--pick);transform:none}
.wbtn[aria-pressed="true"] svg{opacity:1}
.wbtn[aria-pressed="true"]::after{content:"";width:16px;height:3px;border-radius:2px;background:var(--tone);margin-top:1px}
.wbtn[data-w="sunny"]{--tone:#f5b83d}.wbtn[data-w="cloudy"]{--tone:#9aa6b8}.wbtn[data-w="rain"]{--tone:#5aa2e8}.wbtn[data-w="snow"]{--tone:#8fd0f2}
.sbtns{gap:6px}
.sbtn,.sbtn[aria-pressed="true"]{border:1px solid var(--line);box-shadow:none;transform:none;border-radius:999px;font-weight:700;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.sbtn::before{border:0;width:8px;height:8px;box-shadow:inset 0 0 0 1px rgba(51,41,74,.18)}
.sbtn[aria-pressed="true"]{background:var(--on);border-color:transparent;color:var(--ink)}
.row label,.cathead span{font-weight:700;font-size:.9rem;color:var(--ink)}
.slider{accent-color:#e9806f}
.chip{border:0;background:var(--fill);font-weight:700;color:var(--muted);padding:5px 11px;transition:background .2s,color .2s}
.chip:hover{background:var(--fill-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.focus,.focus[aria-pressed="true"]{border:1px solid var(--line);box-shadow:none;transform:none;background:#fff;border-radius:999px;padding:4px 11px}
.focus[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.city{border:1px solid transparent;background:var(--fill);border-radius:12px}
.city:focus{background:#fff;border-color:var(--line)}
.go,.go:active{background:var(--ink);border:0;box-shadow:0 4px 12px rgba(51,41,74,.25);transform:none;border-radius:12px;font-weight:700}
.go:hover{background:#463a63}
.moreBtn{pointer-events:auto;position:relative;z-index:1;margin-bottom:-1px;color:var(--ink);font-weight:700;font-size:.78rem;padding:5px 14px 4px;border-radius:12px 12px 0 0;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.85);border-bottom:0;box-shadow:0 -4px 12px rgba(40,30,80,.08)}
.moreBtn::after{content:" ▴"}
.moreBtn[aria-expanded="true"]::after{content:" ▾"}
@media (max-width:819px){.dock-inner{border-top-left-radius:20px}}
@media (max-width:819px){
  .dock-inner{padding:8px 8px 4px;border-radius:20px}
  .wbtns{border-radius:14px;padding:3px}
  .wbtn[aria-pressed="true"]::after{display:none}
  .badge{border-radius:12px}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.badge,.dock-inner,.hint,.bubble{background:rgba(255,255,255,.94)}}
</style>

<div id="app">
  <canvas id="c" aria-label="날씨가 바뀌는 3D 정원. 드래그해서 둘러볼 수 있어요." tabindex="0"></canvas>

  <div class="hud-top">
    <div class="badge">
      <h1>날씨 정원</h1>
      <p id="place">직접 고른 날씨 · 맑음</p>
    </div>
    <div class="hint" id="hint">드래그로 둘러보기 · 친구들을 눌러 보세요</div>
  </div>

  <div class="bubble" id="bubble" aria-live="polite"></div>
  <div class="zzz" id="zzz" aria-hidden="true"><span>z</span><span>Z</span><span>z</span></div>

  <div class="dock">
    <button class="moreBtn" id="moreBtn" type="button" aria-expanded="false" aria-controls="more">설정 더보기</button>
    <div class="dock-inner">
      <div class="wbtns" role="group" aria-label="날씨 고르기">
        <button class="wbtn" data-w="sunny" aria-pressed="true" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="#33294a" stroke-width="2.2" stroke-linecap="round"><line x1="16" y1="2.5" x2="16" y2="6"/><line x1="16" y1="26" x2="16" y2="29.5"/><line x1="2.5" y1="16" x2="6" y2="16"/><line x1="26" y1="16" x2="29.5" y2="16"/><line x1="6.5" y1="6.5" x2="8.8" y2="8.8"/><line x1="23.2" y1="23.2" x2="25.5" y2="25.5"/><line x1="6.5" y1="25.5" x2="8.8" y2="23.2"/><line x1="23.2" y1="8.8" x2="25.5" y2="6.5"/></g><circle cx="16" cy="16" r="6.5" fill="#ffc93d" stroke="#33294a" stroke-width="2.2"/></svg>
          맑음
        </button>
        <button class="wbtn" data-w="cloudy" aria-pressed="false" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 24h15a5 5 0 0 0 .6-9.96A7.5 7.5 0 0 0 10.2 13 5.5 5.5 0 0 0 9 24z" fill="#ffffff" stroke="#33294a" stroke-width="2.2" stroke-linejoin="round"/></svg>
          흐림
        </button>
        <button class="wbtn" data-w="rain" aria-pressed="false" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 19h15a5 5 0 0 0 .6-9.96A7.5 7.5 0 0 0 10.2 8 5.5 5.5 0 0 0 9 19z" fill="#c9d2de" stroke="#33294a" stroke-width="2.2" stroke-linejoin="round"/><g stroke="#3a86d9" stroke-width="2.4" stroke-linecap="round"><line x1="11" y1="23" x2="9.5" y2="27"/><line x1="17" y1="23" x2="15.5" y2="27"/><line x1="23" y1="23" x2="21.5" y2="27"/></g></svg>
          비
        </button>
        <button class="wbtn" data-w="snow" aria-pressed="false" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="#33294a" stroke-width="2.2" stroke-linecap="round"><line x1="16" y1="4" x2="16" y2="28"/><line x1="5.6" y1="10" x2="26.4" y2="22"/><line x1="5.6" y1="22" x2="26.4" y2="10"/><polyline points="12.5,6.5 16,9 19.5,6.5" fill="none"/><polyline points="12.5,25.5 16,23 19.5,25.5" fill="none"/></g><circle cx="16" cy="16" r="2.6" fill="#7cc3f0" stroke="#33294a" stroke-width="1.8"/></svg>
          눈
        </button>
      </div>

      <div class="sbtns" role="group" aria-label="계절 고르기">
        <button class="sbtn" type="button" data-s="spring" aria-pressed="false">봄</button>
        <button class="sbtn" type="button" data-s="summer" aria-pressed="false">여름</button>
        <button class="sbtn" type="button" data-s="autumn" aria-pressed="false">가을</button>
        <button class="sbtn" type="button" data-s="winter" aria-pressed="false">겨울</button>
      </div>

      <div class="more" id="more">
      <div class="row">
        <label for="sunAmt">햇빛 세기</label>
        <input class="slider" id="sunAmt" type="range" min="20" max="200" step="1" value="75">
        <span class="amt" id="sunLabel">75%</span>
      </div>

      <div class="row">
        <label for="amount">비·눈 세기</label>
        <input class="slider" id="amount" type="range" min="0.15" max="1" step="0.05" value="0.7">
        <span class="amt" id="amtLabel">70%</span>
      </div>

      <div class="catrow">
        <div class="cathead"><span>고양이 행동</span><button class="focus" id="catFocus" type="button" aria-pressed="false">고양이 가까이 보기</button></div>
        <div class="chips" role="group" aria-label="고양이 행동 고르기">
          <button class="chip" type="button" data-cat="auto" aria-pressed="true">알아서</button>
          <button class="chip" type="button" data-cat="wander" aria-pressed="false">산책</button>
          <button class="chip" type="button" data-cat="nap" aria-pressed="false">낮잠</button>
          <button class="chip" type="button" data-cat="groom" aria-pressed="false">그루밍</button>
          <button class="chip" type="button" data-cat="chase" aria-pressed="false">나비 잡기</button>
          <button class="chip" type="button" data-cat="pounce" aria-pressed="false">폴짝폴짝</button>
          <button class="chip" type="button" data-cat="shelter" aria-pressed="false">우산 밑으로</button>
          <button class="chip" type="button" data-cat="petal" aria-pressed="false">꽃잎·낙엽 잡기</button>
          <button class="chip" type="button" data-cat="roll" aria-pressed="false">낙엽에서 뒹굴기</button>
          <button class="chip" type="button" data-cat="sit" aria-pressed="false">얌전히 앉기</button>
        </div>
      </div>

      <form class="row" id="cityForm" autocomplete="off">
        <input class="city" id="city" type="text" placeholder="도시 이름 (예: 서울, Tokyo)" value="서울" aria-label="도시 이름">
        <button class="go" id="goBtn" type="submit">실제 날씨</button>
      </form>
      <p class="status" id="status" aria-live="polite"></p>
      <p class="credit">날씨 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const statusEl = $('#status');
const setStatus = t => { statusEl.textContent = t; };
if (!window.THREE) { setStatus('3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }

/* ---------- basics ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8ff);
scene.fog = new THREE.Fog(0x9fd8ff, 45, 110);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 300);

// seeded random so the garden is the same every visit
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: .85, metalness: 0 }, o || {}));
function mesh(geo, m, x, y, z) { const me = new THREE.Mesh(geo, m); me.position.set(x || 0, y || 0, z || 0); me.castShadow = true; me.receiveShadow = true; return me; }
function jitter(geo, amt) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const a = Math.sin(x * 12.99 + y * 78.23 + z * 37.71) * 43758.5453, r1 = a - Math.floor(a);
    const b = Math.sin(x * 93.9 + y * 67.3 + z * 11.1) * 24634.6345, r2 = b - Math.floor(b);
    const c = Math.sin(x * 41.3 + y * 17.7 + z * 59.9) * 15731.743, r3 = c - Math.floor(c);
    p.setXYZ(i, x + (r1 - .5) * amt, y + (r2 - .5) * amt * .5, z + (r3 - .5) * amt);
  }
  geo.computeVertexNormals();
  return geo;
}

  });
  const head = new THREE.Group(); head.position.y = 1.78; body.add(head);

  const hair = mesh(new THREE.SphereGeometry(.77, 24, 18, 0, Math.PI * 2, 0, Math.PI * .5), mat(0x5a3a2e), 0, .02, -.05);
  hair.rotation.x = -.35; head.add(hair);

    e.add(mesh(new THREE.SphereGeometry(.032, 24, 18), new THREE.MeshBasicMaterial({ color: 0xffffff }), .03, .05, .05));
    head.add(e); eyes.push(e);

  });
  const mouth = mesh(new THREE.TorusGeometry(.08, .025, 12, 28, Math.PI), mat(0x7a3b3b), 0, -.2, .69); mouth.rotation.z = Math.PI; head.add(mouth);
  function arm(x) {

  }
  const armL = arm(-.52), armR = arm(.52);
  // umbrella (rain)
  const umbrella = new THREE.Group(); umbrella.position.set(.78, 0, .05); body.add(umbrella);

  umbrella.add(mesh(new THREE.SphereGeometry(.08, 24, 18), mat(0xffffff), 0, 3.62, 0));
  umbrella.rotation.z = .18; umbrella.scale.setScalar(.001);
  // beanie + scarf (snow)
  const hat = new THREE.Group(); head.add(hat);

  const dome = mesh(new THREE.SphereGeometry(.8, 24, 18, 0, Math.PI * 2, 0, Math.PI * .5), knit, 0, .12, -.02); hat.add(dome);
  const rim = mesh(new THREE.TorusGeometry(.75, .11, 12, 28), mat(0xffffff), 0, .2, -.02); rim.rotation.x = Math.PI / 2; hat.add(rim);
  hat.add(mesh(new THREE.SphereGeometry(.17, 24, 18), mat(0xffffff), 0, .95, -.02));
  hat.scale.setScalar(.001);
  const scarf = new THREE.Group(); scarf.position.y = 1.16; body.add(scarf);
  const sm = mat(0x4fb0c6);
  const ring = mesh(new THREE.TorusGeometry(.42, .12, 12, 28), sm); ring.rotation.x = Math.PI / 2; scarf.add(ring);
  const tail = mesh(new THREE.BoxGeometry(.2, .45, .08), sm, .22, -.25, .42); tail.rotation.z = .15; scarf.add(tail);

/* ---------- cat ---------- */
function makeCat() {
  // Scottish fold: round white cat with warm yellow patches, folded ears, striped tail
  const g = new THREE.Group(); const fur = mat(0xeec98a), white = mat(0xfffaf2);
  const b = mesh(new THREE.SphereGeometry(.42, 24, 18), white, 0, .42, 0); b.scale.set(1.05, .95, 1.15); g.add(b);
  // yellow saddle on the back + a patch on one side
  const saddle = mesh(new THREE.SphereGeometry(.43, 24, 18, 0, Math.PI * 2, 0, Math.PI * .36), fur, 0, .42, -.04);
  saddle.scale.set(1.05, .95, 1.15); saddle.rotation.x = -.55; g.add(saddle);
  const side = mesh(new THREE.SphereGeometry(.2, 20, 14), fur, .33, .48, -.05); side.scale.set(.45, 1, 1.2); g.add(side);
  const chest = mesh(new THREE.SphereGeometry(.26, 24, 18), white, 0, .45, .3); chest.scale.set(1, 1.2, .6); g.add(chest);
  const head = new THREE.Group(); head.position.set(0, .95, .22); g.add(head);
  const eyes = [];
  head.add(mesh(new THREE.SphereGeometry(.37, 24, 18), white));
  // cream patches over both eyes and ears, split by a white stripe from the nose up the forehead
  const BLAZE = .3;
  const hood = mesh(new THREE.SphereGeometry(.38, 28, 20, Math.PI / 2 + BLAZE, Math.PI * 2 - BLAZE * 2, 0, Math.PI * .45), fur);
  hood.rotation.x = .5; head.add(hood);
  [-1, 1].forEach(sx => {
    // small folded ears tipping forward
    const ear = new THREE.Group(); ear.position.set(sx * .2, .31, .06); ear.rotation.set(1.05, 0, -sx * .45); head.add(ear);
    const flap = mesh(new THREE.ConeGeometry(.12, .17, 16), fur, 0, .09, 0); ear.add(flap);
    const e = mesh(new THREE.SphereGeometry(.055, 24, 18), mat(0x2b2233), sx * .14, .02, .34); e.scale.y = 1.35; head.add(e); eyes.push(e);
    e.add(mesh(new THREE.SphereGeometry(.018, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), .012, .015, .04));
    const ck = mesh(new THREE.SphereGeometry(.06, 12, 8), mat(0xffb3c6), sx * .2, -.1, .29); ck.scale.set(1, .6, .4); head.add(ck);
  });
  head.add(mesh(new THREE.SphereGeometry(.04, 24, 18), mat(0xff8fab), 0, -.06, .37));
  const muzzle = mesh(new THREE.SphereGeometry(.14, 24, 18), white, 0, -.12, .27); muzzle.scale.set(1.35, .8, .7); head.add(muzzle);
  const paws = [-.15, .15].map(x => { const pw = mesh(new THREE.SphereGeometry(.1, 24, 18), white, x, .08, .36); g.add(pw); return pw; });
  // tail: yellow/white stripes with a white tip
  let parent = new THREE.Group(); parent.position.set(0, .3, -.42); g.add(parent);
  const segs = [];
  for (let i = 0; i < 6; i++) {
    const s = new THREE.Group(); s.position.y = i === 0 ? 0 : .15; s.rotation.x = -.3;
    s.add(mesh(new THREE.CylinderGeometry(.062, .068, .16, 20), i % 2 === 0 ? fur : white, 0, .08, 0));
    if (i === 5) s.add(mesh(new THREE.SphereGeometry(.064, 16, 12), white, 0, .16, 0));
    parent.add(s); segs.push(s); parent = s;
  }
  segs[0].rotation.x = -1.2;
  g.userData = { kind: 'cat', head, segs, eyes, paws, jumpV: 0, jumpY: 0, h: 1.6, mode: 'sit', timer: 2, weather: 'sunny', nap: 0, cool: 0 };
  return g;
}

function codeInfo(c) {
  if (c <= 1) return ['sunny', .6, c === 0 ? '맑음' : '대체로 맑음'];
  if (c <= 3 || c === 45 || c === 48) return ['cloudy', .6, c === 2 ? '구름 조금' : c === 3 ? '흐림' : '안개'];
  if (c >= 51 && c <= 57) return ['rain', .35, '이슬비'];
  if (c >= 61 && c <= 67) return ['rain', c === 61 || c === 66 ? .5 : c === 63 ? .75 : 1, '비'];
  if (c >= 71 && c <= 77) return ['snow', c === 71 ? .4 : c === 73 ? .7 : 1, '눈'];
  if (c >= 80 && c <= 82) return ['rain', [.5, .8, 1][c - 80], '소나기'];
  if (c === 85 || c === 86) return ['snow', c === 85 ? .6 : 1, '눈 소나기'];
  if (c >= 95) return ['rain', 1, '뇌우'];
  return ['cloudy', .5, '흐림'];
}

  e.preventDefault();
  const q = $('#city').value.trim();
  if (!q) { setStatus('도시 이름을 입력해 주세요.'); return; }
  goBtn.disabled = true; setStatus('"' + q + '"의 날씨를 찾고 있어요...');
  try {
    const gRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ko&format=json&name=' + encodeURIComponent(q));
    if (!gRes.ok) throw new Error('geo');
    const g = await gRes.json();
    if (!g.results || !g.results.length) { setStatus('"' + q + '"을(를) 찾지 못했어요. 영어 이름(예: Seoul)으로도 해 보세요.'); return; }
    const p = g.results[0];
    const wRes = await fetch('https://api.open-meteo.com/v1/forecast?current=temperature_2m,weather_code&timezone=auto&latitude=' + p.latitude + '&longitude=' + p.longitude);
    if (!wRes.ok) throw new Error('wx');
    const w = await wRes.json();
    const info = codeInfo(w.current.weather_code);
    setWeather(info[0], { intensity: info[1], source: 'live' });
    const temp = Math.round(w.current.temperature_2m);
    state.liveLabel = p.name + (p.country ? ', ' + p.country : '') + ' · ' + temp + '°C · ' + info[2];
    setSeason(seasonFor(new Date().getMonth(), p.latitude < 0));
    setStatus('실제 날씨를 반영했어요. 버튼을 누르면 다시 직접 조작할 수 있어요.');
